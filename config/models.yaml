# ============================================================================
#  GEN.Ai Image Workshop — Bibliothèque de modèles
# ----------------------------------------------------------------------------
#  Source unique de vérité : téléchargement à la demande, recommandations selon
#  le matériel, et réglages automatiques par modèle (steps/cfg/sampler/...).
#
#  Jokers dans `match` :
#    {quant}     -> quantification du modèle de diffusion (selon VRAM)
#    {enc_quant} -> quantification de l'encodeur de texte (selon RAM, en offload)
#  Le téléchargeur interroge l'API Hugging Face et choisit le meilleur fichier.
# ============================================================================

base_models:

  # --------------------------------------------------------------------------
  - id: flux2-klein-9b
    name: "Flux.2 Klein 9B"
    family: flux2
    tags: [qualité, rapide, distillé, édition]
    description: >
      FLUX.2 Klein 9B en GGUF (distillé, rapide : 4 pas, CFG 1.0). Diffusion Q4
      ≈ 5 Go en VRAM ; encodeur **Qwen3-8B officiel** (dépôt Unsloth) déchargé en
      RAM ; VAE flux2. Tourne dès 10–12 Go. **Text-to-image ET édition** :
      fournissez une image de référence (jusqu'à 3) et décrivez la modification
      dans le prompt.
    sources:
      diffusion:
        repo: leejet/FLUX.2-klein-9B-GGUF
        match: "*klein-9b*{quant}.gguf"
        quantizable: true
      vae:
        repo: Comfy-Org/flux2-klein-9B
        match: "split_files/vae/flux2-vae.safetensors"
      text_encoder:
        # Encodeur Qwen3-8B officiel en GGUF (doc flux2.md). Ladder complet.
        repo: unsloth/Qwen3-8B-GGUF
        match: "Qwen3-8B-{enc_quant}.gguf"
        quantizable: true
    defaults:
      steps: 4
      cfg_scale: 1.0
      sampler: euler
      scheduler: auto     # doc sd.cpp : scheduler non forcé (défaut moteur)
      width: 1024
      height: 1024
      supports_negative: false
      edit: full          # modèle d'édition natif : UI « images de référence »
    presets:
      # Aligné sur docs/flux2.md : euler, cfg 1.0, 4 pas, scheduler = défaut moteur
      # (la doc ne force jamais de scheduler). Variantes = plus de pas seulement.
      - {name: "⚡ Recommandé (doc, 4 pas)", sampler: euler, scheduler: auto, steps: 4, cfg_scale: 1.0}
      - {name: "Équilibré (6 pas)",          sampler: euler, scheduler: auto, steps: 6, cfg_scale: 1.0}
      - {name: "Qualité (8 pas)",            sampler: euler, scheduler: auto, steps: 8, cfg_scale: 1.0}
    vram_min_gb: 10

  # --------------------------------------------------------------------------
  - id: krea2-turbo
    name: "Krea 2 Turbo"
    family: krea2
    tags: [rapide, distillé, krea]
    description: >
      Krea 2 « Turbo » (distillé) en GGUF — variante rapide (8 pas, CFG 1.0) du
      modèle Krea 2. Encodeur **Qwen3-VL-4B-Instruct officiel** (dépôt Qwen, via
      --llm, déchargé en RAM) + VAE WAN 2.1. Photoréalisme. Le profil auto
      choisit la diffusion selon la VRAM (**11 Go → Q4_K_M, 12 Go → Q5_K_M**)
      et l'encodeur selon la RAM (**Q8_0** dès 32 Go). **Édition d'image
      (Ostris Edit)** :
      chargez une image, cochez « Mode édition » et installez le **LoRA
      d'édition** (bouton 1 clic) — moteur sd.cpp récent requis
      (update-engine.bat).
    sources:
      diffusion:
        repo: realrebelai/KREA-2_GGUFs
        match: "TURBO/Krea-2-Turbo-{quant}.gguf"
        quantizable: true
      text_encoder:
        # Encodeur officiel Qwen (doc krea2.md). Nom de fichier « Qwen3VL » sans
        # tiret ; pas de « * » en tête pour ne PAS matcher les fichiers mmproj-*
        # (le projecteur vision est un composant SÉPARÉ, ci-dessous).
        repo: Qwen/Qwen3-VL-4B-Instruct-GGUF
        match: "Qwen3VL-4B-Instruct-{enc_quant}.gguf"
        quantizable: true
      text_encoder_vision:
        # Projecteur vision (mmproj) : permet à Qwen3-VL de « voir » l'image de
        # référence en mode ÉDITION (Krea 2 Ostris Edit, sd.cpp --llm_vision).
        # Optionnel : le text-to-image marche sans ; chargé seulement en édition.
        repo: Qwen/Qwen3-VL-4B-Instruct-GGUF
        match: "mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf"
        optional: true
      vae:
        repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged
        match: "*wan_2.1_vae.safetensors"
    defaults:
      steps: 8
      cfg_scale: 1.0
      sampler: euler
      scheduler: auto     # doc sd.cpp : scheduler non forcé (défaut moteur)
      width: 1024
      height: 1024
      supports_negative: false
      edit: optional      # édition possible AVEC un LoRA d'édition (Ostris Edit)
      # LoRA d'édition officiel, téléchargeable en 1 clic depuis l'onglet
      # (bouton du Mode édition). Premier .safetensors du dépôt.
      edit_lora: ostris/krea2_turbo_style_reference
    presets:
      # Aligné sur docs/krea2.md : euler + scheduler = défaut moteur, cfg 1.0.
      # La doc ne fixe pas de pas ; on garde le 8 pas « officiel » du Turbo distillé.
      - {name: "⚡ Officiel (8 pas)",   sampler: euler, scheduler: auto, steps: 8,  cfg_scale: 1.0}
      - {name: "Très rapide (4 pas)",  sampler: euler, scheduler: auto, steps: 4,  cfg_scale: 1.0}
      - {name: "Qualité (12 pas)",     sampler: euler, scheduler: auto, steps: 12, cfg_scale: 1.0}
    vram_min_gb: 10

  # --------------------------------------------------------------------------
  # Boogu-Image 0.1 « Edit » — édition PAR INSTRUCTION (doc sd.cpp : boogu_image.md)
  #
  # Pourquoi la variante NON-Turbo alors qu'un Edit-Turbo 4 pas existe :
  # l'équipe Boogu a publié le 8 juillet 2026 un correctif de l'Edit-Turbo qui
  # règle « une dégradation sévère de la qualité d'image et de mauvaises
  # performances sur la suppression d'objets et d'autres tâches d'édition »
  # (révisions hotfix-1k-20260708 / hotfix-1k5-20260708). Or les DEUX dépôts
  # GGUF d'Edit-Turbo existants datent d'AVANT ce correctif (realrebelai
  # 01/07, chfm 06/07) : les câbler reviendrait à livrer la version cassée,
  # précisément sur l'usage visé. On prend donc l'Edit standard, jamais signalé
  # défectueux — plus lent (25-50 pas, CFG 5) mais correct.
  # À réévaluer dès qu'un GGUF de la révision hotfix-1k apparaît ; en attendant,
  # les poids bf16 corrigés sont sur Comfy-Org/Boogu-Image
  # (boogu_image_edit_turbo_hotfix_1k_20260708_bf16.safetensors) et peuvent être
  # convertis en GGUF depuis l'onglet « 🔧 Convertir en GGUF ».
  - id: boogu-edit
    name: "Boogu Image Edit 10B"
    family: boogu
    tags: [édition, instruction, qualité, apache]
    description: >
      Boogu-Image-0.1 **Edit** (10,3 B, **Apache 2.0**) — édition **par
      instruction** : « enlève la voiture », « change le fond en plage »,
      « remplace le texte par … ». C'est ce qui se rapproche le plus d'un
      Gemini/ChatGPT parmi les poids ouverts qui tiennent sur 11-12 Go, et il
      devance sur Qwen-Image-Bench des modèles deux à huit fois plus gros.
      Architecture unifiée compréhension + génération : encodeur
      **Qwen3-VL-8B** (avec projecteur vision, chargé seulement en édition) et
      **VAE Flux.1**. Diffusion Q4_1 ≈ 7,4 Go, Q5_1 ≈ 8,6 Go.
      ⚠️ **Lent, et c'est normal** : contrairement à Flux.2 Klein et Krea 2 qui
      sont distillés (4-8 pas, CFG 1.0), celui-ci demande **25 à 50 pas et un
      CFG de 5** — comptez plusieurs minutes par édition. En contrepartie, le
      **prompt négatif fonctionne vraiment** ici (CFG > 1).
      ℹ️ La doc sd.cpp ne montre qu'**une seule image de référence** pour Boogu
      (contrairement à Flux.2 qui en accepte 3) : commencez par une seule ; les
      emplacements 2 et 3 restent utilisables mais ne sont pas documentés.
    sources:
      diffusion:
        # Quants « plats » uniquement (Q4_0/Q4_1/Q5_0/Q5_1/Q8_0) : les K-quants
        # n'existent pas encore pour l'architecture Boogu/OmniGen dans llama.cpp.
        # Le repli quant du téléchargeur arrondit vers le bas (Q4_K_M -> Q4_1).
        repo: realrebelai/Boogu-Image-Edit_GGUFs
        match: "boogu-edit-dit-{quant}.gguf"
        quantizable: true
      text_encoder:
        # Dépôt officiel Qwen, même convention de nommage que Krea 2.
        repo: Qwen/Qwen3-VL-8B-Instruct-GGUF
        match: "Qwen3VL-8B-Instruct-{enc_quant}.gguf"
        quantizable: true
      text_encoder_vision:
        # Projecteur vision (--llm_vision) : indispensable pour que l'encodeur
        # VOIE l'image de référence. Chargé uniquement en édition.
        repo: Qwen/Qwen3-VL-8B-Instruct-GGUF
        match: "mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf"
        optional: true
      vae:
        # VAE Flux.1 repackagé (168 Mo). La doc sd.cpp pointe vers
        # black-forest-labs/FLUX.1-dev, dont l'accès demande d'accepter une
        # licence : ce dépôt-ci est libre d'accès et contient le même VAE.
        repo: Comfy-Org/Boogu-Image
        match: "vae/flux1_vae_bf16.safetensors"
    defaults:
      steps: 25
      cfg_scale: 5.0
      sampler: euler
      scheduler: auto     # doc sd.cpp : scheduler non forcé (défaut moteur)
      width: 1024
      height: 1024
      supports_negative: true   # CFG 5 -> le prompt négatif est pris en compte
      edit: full          # modèle d'édition natif : UI « images de référence »
    presets:
      # Model Zoo officiel : Edit (TI2I) = 25~50 pas, CFG 2.0~5.0 (ex. 5.0).
      - {name: "⚡ Le plus rapide (25 pas, CFG 5)", sampler: euler, scheduler: auto, steps: 25, cfg_scale: 5.0}
      - {name: "Équilibré (35 pas, CFG 5)",        sampler: euler, scheduler: auto, steps: 35, cfg_scale: 5.0}
      - {name: "Qualité (50 pas, CFG 5)",          sampler: euler, scheduler: auto, steps: 50, cfg_scale: 5.0}
      - {name: "Édition douce (25 pas, CFG 2.5)",  sampler: euler, scheduler: auto, steps: 25, cfg_scale: 2.5}
    vram_min_gb: 10

# ============================================================================
#  PiD — décodeur pixel-diffusion NVIDIA, natif sd.cpp (doc : docs/pid.md).
#  Décode/agrandit ×4 (entraîné 512 -> 2048, 4 pas) via -r + --vae-format flux2.
#  ⚠️ Poids officiels sous licence NSCLv1 (non commerciale).
#  ⚠️ PiD 1.5 (1024 -> 4096) est SUPPORTÉ par sd.cpp ≥ master-782 mais HORS DE
#  PORTÉE des cartes 11-12 Go : buffer de calcul mesuré à 14,2 Go en 4096² +
#  « CUDA error: invalid configuration argument » (limites de kernel) sur
#  2080 Ti. Il faudrait ~16 Go+ de VRAM. À réévaluer si sd.cpp ajoute un
#  découpage/tiling du calcul PiD, ou sur une carte plus grosse :
#  match "*pid_1.5_flux2_1024_to_4096_4step_bf16*" + target 4096.
# ============================================================================
pid:
  # Variante Flux.2 : cohérente avec la génération Flux.2 Klein (backbone + VAE
  # Flux.2), ce qui réduit les artefacts par rapport au PiD flux1. Réutilise le
  # VAE Flux.2 DÉJÀ téléchargé pour la génération (aucun re-téléchargement du VAE).
  name: "PiD — décodeur/upscaler pixel-diffusion Flux.2 (NVIDIA)"
  target: 2048          # côté long visé (modèle v1 : 512 -> 2048)
  factor: 4             # ratio fixe du modèle (512 -> 2048 = ×4)
  steps: 4
  vae_format: flux2     # backbone Flux.2 -> VAE au format flux2
  sources:
    diffusion:
      repo: Comfy-Org/PixelDiT
      # v1 bf16 — le seul qui tienne sur 11-12 Go (voir note 1.5 ci-dessus).
      match: "pid_flux2_512_to_2048_4step_bf16*.safetensors"
    text_encoder:
      repo: Comfy-Org/PixelDiT
      match: "gemma_2_2b_it*.safetensors"
    vae:
      # Le VAE Flux.2 de la génération (déjà présent si tu génères en Flux.2 Klein).
      repo: Comfy-Org/flux2-klein-9B
      match: "split_files/vae/flux2-vae.safetensors"


# ============================================================================
#  Upscalers ESRGAN GGUF — agrandissement SIMPLE, natif sd.cpp (--mode upscale)
#  Réseaux ESRGAN (2x/4x) : déterministe, 100% GPU, aucun PyTorch ni prompt.
#  Source : huggingface.co/wbruna/upscalers-sdcpp-gguf
# ============================================================================
upscalers:
  name: "Upscalers ESRGAN (GGUF, sd.cpp)"
  repo: wbruna/upscalers-sdcpp-gguf
  files:
    - 2x-ESRGAN.gguf
    - 2xPSNR.gguf
    - 2x_StarSample_V2.0.gguf
    - 4xLSDIRplusC.gguf
    - 4xLSDIRplusN.gguf
    - 4xLSDIRplusR.gguf
    - 4xNomos2_otf_esrgan.gguf
    - 4xNomos8kSC.gguf
    - 4xNomosWebPhoto_esrgan.gguf
    - 4xUltrasharpV10.gguf
    - 4x_NickelbackFS_72000_G.gguf
    - 4x_Nickelback_70000G.gguf
    - 4x_foolhardy_Remacri.gguf
    - 4x_foolhardy_Remacri_ExtraSmoother.gguf
    - RealESRGAN_x4plus.gguf
    - RealESRGAN_x4plus_anime_6B.gguf
    - smbss_2x_RRDB_Animation.gguf
