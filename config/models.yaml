# ============================================================================
#  GEN.Ai Image Workshop — Bibliothèque de modèles
# ----------------------------------------------------------------------------
#  Source unique de vérité : téléchargement à la demande, recommandations selon
#  le matériel, et réglages automatiques par modèle (steps/cfg/sampler/...).
#
#  Jokers dans `match` :
#    {quant}     -> quantification du modèle de diffusion (selon VRAM)
#    {enc_quant} -> quantification de l'encodeur de texte (selon RAM, en offload)
#  Le téléchargeur interroge l'API Hugging Face et choisit le meilleur fichier.
# ============================================================================

base_models:

  # --------------------------------------------------------------------------
  - id: flux2-klein-9b
    name: "Flux.2 Klein 9B"
    family: flux2
    tags: [qualité, rapide, distillé, édition]
    description: >
      FLUX.2 Klein 9B en GGUF (distillé, rapide : 4 pas, CFG 1.0). Diffusion Q4
      ≈ 5 Go en VRAM ; encodeur **Qwen3-8B officiel** (dépôt Unsloth) déchargé en
      RAM ; VAE flux2. Tourne dès 10–12 Go. **Text-to-image ET édition** :
      fournissez une image de référence (jusqu'à 3) et décrivez la modification
      dans le prompt.
    sources:
      diffusion:
        repo: leejet/FLUX.2-klein-9B-GGUF
        match: "*klein-9b*{quant}.gguf"
        quantizable: true
      vae:
        repo: Comfy-Org/flux2-klein-9B
        match: "split_files/vae/flux2-vae.safetensors"
      text_encoder:
        # Encodeur Qwen3-8B officiel en GGUF (doc flux2.md). Ladder complet.
        repo: unsloth/Qwen3-8B-GGUF
        match: "Qwen3-8B-{enc_quant}.gguf"
        quantizable: true
    defaults:
      steps: 4
      cfg_scale: 1.0
      sampler: euler
      scheduler: auto     # doc sd.cpp : scheduler non forcé (défaut moteur)
      width: 1024
      height: 1024
      supports_negative: false
      edit: full          # modèle d'édition natif : UI « images de référence »
    presets:
      # Aligné sur docs/flux2.md : euler, cfg 1.0, 4 pas, scheduler = défaut moteur
      # (la doc ne force jamais de scheduler). Variantes = plus de pas seulement.
      - {name: "⚡ Recommandé (doc, 4 pas)", sampler: euler, scheduler: auto, steps: 4, cfg_scale: 1.0}
      - {name: "Équilibré (6 pas)",          sampler: euler, scheduler: auto, steps: 6, cfg_scale: 1.0}
      - {name: "Qualité (8 pas)",            sampler: euler, scheduler: auto, steps: 8, cfg_scale: 1.0}
    vram_min_gb: 10

  # --------------------------------------------------------------------------
  - id: krea2-turbo
    name: "Krea 2 Turbo"
    family: krea2
    tags: [rapide, distillé, krea]
    description: >
      Krea 2 « Turbo » (distillé) en GGUF — variante rapide (8 pas, CFG 1.0) du
      modèle Krea 2. Encodeur **Qwen3-VL-4B-Instruct officiel** (dépôt Qwen, via
      --llm, déchargé en RAM) + VAE WAN 2.1. Photoréalisme. Le profil auto
      choisit la diffusion selon la VRAM (**11 Go → Q4_K_M, 12 Go → Q5_K_M**)
      et l'encodeur selon la RAM (**Q8_0** dès 32 Go). **Édition d'image
      (Ostris Edit)** :
      chargez une image, cochez « Mode édition » et installez le **LoRA
      d'édition** (bouton 1 clic) — moteur sd.cpp récent requis
      (update-engine.bat).
    sources:
      diffusion:
        repo: realrebelai/KREA-2_GGUFs
        match: "TURBO/Krea-2-Turbo-{quant}.gguf"
        quantizable: true
      text_encoder:
        # Encodeur officiel Qwen (doc krea2.md). Nom de fichier « Qwen3VL » sans
        # tiret ; pas de « * » en tête pour ne PAS matcher les fichiers mmproj-*
        # (le projecteur vision est un composant SÉPARÉ, ci-dessous).
        repo: Qwen/Qwen3-VL-4B-Instruct-GGUF
        match: "Qwen3VL-4B-Instruct-{enc_quant}.gguf"
        quantizable: true
      text_encoder_vision:
        # Projecteur vision (mmproj) : permet à Qwen3-VL de « voir » l'image de
        # référence en mode ÉDITION (Krea 2 Ostris Edit, sd.cpp --llm_vision).
        # Optionnel : le text-to-image marche sans ; chargé seulement en édition.
        repo: Qwen/Qwen3-VL-4B-Instruct-GGUF
        match: "mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf"
        optional: true
      vae:
        repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged
        match: "*wan_2.1_vae.safetensors"
    defaults:
      steps: 8
      cfg_scale: 1.0
      sampler: euler
      scheduler: auto     # doc sd.cpp : scheduler non forcé (défaut moteur)
      width: 1024
      height: 1024
      supports_negative: false
      edit: optional      # édition possible AVEC un LoRA d'édition (Ostris Edit)
      # LoRA d'édition officiel, téléchargeable en 1 clic depuis l'onglet
      # (bouton du Mode édition). Premier .safetensors du dépôt.
      edit_lora: ostris/krea2_turbo_style_reference
    presets:
      # Aligné sur docs/krea2.md : euler + scheduler = défaut moteur, cfg 1.0.
      # La doc ne fixe pas de pas ; on garde le 8 pas « officiel » du Turbo distillé.
      - {name: "⚡ Officiel (8 pas)",   sampler: euler, scheduler: auto, steps: 8,  cfg_scale: 1.0}
      - {name: "Très rapide (4 pas)",  sampler: euler, scheduler: auto, steps: 4,  cfg_scale: 1.0}
      - {name: "Qualité (12 pas)",     sampler: euler, scheduler: auto, steps: 12, cfg_scale: 1.0}
    vram_min_gb: 10

  # --------------------------------------------------------------------------
  # Boogu-Image 0.1 « Edit-Turbo » — édition PAR INSTRUCTION en 4 pas
  # (doc sd.cpp : boogu_image.md)
  #
  # ⚠️ VERSION PRÉ-CORRECTIF, CHOIX ASSUMÉ. L'équipe Boogu a publié le 8 juillet
  # 2026 un correctif de l'Edit-Turbo réglant « une dégradation sévère de la
  # qualité d'image et de mauvaises performances sur la suppression d'objets et
  # d'autres tâches d'édition » (révisions hotfix-1k-20260708 / hotfix-1k5).
  # Les deux dépôts GGUF d'Edit-Turbo existants sont ANTÉRIEURS (realrebelai
  # 01/07, chfm 06/07) et aucun GGUF de la révision corrigée n'a été publié
  # depuis (vérifié le 29/07/2026 : le seul dérivé du hotfix, jqw5585/
  # boogu-image-edit-turbo-hotfix-mxfp8, est en mxfp8, non chargeable par sd.cpp).
  # On prend donc la version pré-correctif pour avoir les 4 pas, en connaissance
  # de cause.
  #
  # DEUX PORTES DE SORTIE si la qualité déçoit (surtout en suppression d'objet) :
  #  1. la variante NON-Turbo, jamais signalée défectueuse, partage encodeur,
  #     mmproj et VAE — seul le DiT change. Télécharger un
  #     boogu-edit-dit-*.gguf depuis realrebelai/Boogu-Image-Edit_GGUFs et le
  #     désigner via « 📂 Fichiers locaux → diffusion » dans le même onglet
  #     (25-50 pas, CFG 2-5 : régler les curseurs en conséquence) ;
  #  2. les poids bf16 CORRIGÉS sont sur Comfy-Org/Boogu-Image
  #     (boogu_image_edit_turbo_hotfix_1k_20260708_bf16.safetensors, 20,6 Go) et
  #     se quantifient depuis l'onglet « 🔧 Convertir en GGUF ».
  # À rebrancher dès qu'un GGUF de la révision hotfix-1k est publié.
  - id: boogu-edit-turbo
    name: "Boogu Image Edit Turbo 10B"
    family: boogu
    tags: [édition, instruction, rapide, distillé, apache]
    description: >
      Boogu-Image-0.1 **Edit-Turbo** (10,3 B, **Apache 2.0**) — édition **par
      instruction** : « enlève la voiture », « change le fond en plage »,
      « remplace le texte par … ». C'est ce qui se rapproche le plus d'un
      Gemini/ChatGPT parmi les poids ouverts qui tiennent sur 11-12 Go, et il
      devance sur Qwen-Image-Bench des modèles deux à huit fois plus gros.
      Variante **distillée : 4 pas, CFG 1.0** — même profil de vitesse que
      Flux.2 Klein. Architecture unifiée compréhension + génération : encodeur
      **Qwen3-VL-8B** (avec projecteur vision, chargé seulement en édition) et
      **VAE Flux.1**. Diffusion Q4_1 ≈ 7,4 Go, Q5_1 ≈ 8,6 Go.
      ⚠️ **Poids antérieurs au correctif du 8 juillet 2026**, qui réglait une
      dégradation de qualité et de mauvaises performances **sur la suppression
      d'objets** : aucun GGUF de la version corrigée n'existe à ce jour. Si un
      « enlève ceci » donne un résultat médiocre, c'est ça — voir l'aide de
      l'onglet « 🧹 Gestion & aide » pour les deux solutions de repli.
      ℹ️ CFG 1.0 : le **prompt négatif est ignoré** (champ masqué), comme sur
      Flux.2 Klein et Krea 2. La doc sd.cpp ne montre qu'**une seule image de
      référence** pour Boogu (Flux.2 en accepte 3) : les emplacements 2 et 3
      restent utilisables mais ne sont pas documentés.
    sources:
      diffusion:
        # Quants « plats » uniquement (Q4_0/Q4_1/Q5_0/Q5_1/Q8_0) : les K-quants
        # n'existent pas encore pour l'architecture Boogu/OmniGen dans llama.cpp.
        # Le repli quant du téléchargeur arrondit vers le bas (Q4_K_M -> Q4_1).
        repo: realrebelai/Boogu-Image-Edit-Turbo_GGUFs
        match: "boogu-edit-turbo-dit-{quant}.gguf"
        quantizable: true
      text_encoder:
        # Dépôt officiel Qwen, même convention de nommage que Krea 2.
        repo: Qwen/Qwen3-VL-8B-Instruct-GGUF
        match: "Qwen3VL-8B-Instruct-{enc_quant}.gguf"
        quantizable: true
      text_encoder_vision:
        # Projecteur vision (--llm_vision) : indispensable pour que l'encodeur
        # VOIE l'image de référence. Chargé uniquement en édition.
        repo: Qwen/Qwen3-VL-8B-Instruct-GGUF
        match: "mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf"
        optional: true
      vae:
        # VAE Flux.1 repackagé (168 Mo). La doc sd.cpp pointe vers
        # black-forest-labs/FLUX.1-dev, dont l'accès demande d'accepter une
        # licence : ce dépôt-ci est libre d'accès et contient le même VAE.
        repo: Comfy-Org/Boogu-Image
        match: "vae/flux1_vae_bf16.safetensors"
    defaults:
      steps: 4
      cfg_scale: 1.0
      sampler: euler
      scheduler: auto     # doc sd.cpp : scheduler non forcé (défaut moteur)
      width: 1024
      height: 1024
      supports_negative: false  # CFG 1.0 (distillé) -> le négatif est ignoré
      edit: full          # modèle d'édition natif : UI « images de référence »
    presets:
      # Model Zoo officiel : Edit-Turbo (TI2I) = 4 pas, CFG 1.0, résolution 1K.
      # Les variantes ne font qu'ajouter des pas ; monter le CFG n'a pas de sens
      # sur un modèle distillé (il est entraîné pour CFG 1.0).
      - {name: "⚡ Officiel (4 pas)",   sampler: euler, scheduler: auto, steps: 4, cfg_scale: 1.0}
      - {name: "Équilibré (6 pas)",     sampler: euler, scheduler: auto, steps: 6, cfg_scale: 1.0}
      - {name: "Qualité (8 pas)",       sampler: euler, scheduler: auto, steps: 8, cfg_scale: 1.0}
    vram_min_gb: 10

  # ==========================================================================
  #  VIDÉO — LTX-2.3 (Lightricks), natif sd.cpp « -M vid_gen » (docs/ltx2.md)
  # --------------------------------------------------------------------------
  #  `kind: video` : ces modèles ne sortent PAS d'image. Ils sont exclus des
  #  onglets de génération et d'outpaint, et n'apparaissent que dans l'onglet
  #  « 🎬 Vidéo » et dans le Catalogue (pour le téléchargement).
  #
  #  ⚠️ ORDRE DE GRANDEUR. Diffusion 22 B (≈ 14 Go en Q4_K_M) + encodeur
  #  Gemma-3-12B (7,3 Go) + 2 VAE + connecteurs : ~25 Go sur le disque et
  #  autant en RAM. Sur 11-12 Go de VRAM ça tourne UNIQUEMENT grâce à
  #  --offload-to-cpu (poids en RAM, couches envoyées au GPU au fil de l'eau) —
  #  d'où la RAM 32 Go minimum, 64 Go confortable. Compter plusieurs minutes
  #  par clip : c'est normal, ce n'est pas un blocage.
  #
  #  Deux variantes, mêmes fichiers d'encodeur (partagés, jamais téléchargés
  #  deux fois) mais VAE/connecteurs distincts :
  #   · Distilled 1.1 -> 8 pas, CFG 1.0. C'est CELLE À PRENDRE en 11-12 Go.
  #   · Dev           -> ~20 pas, CFG 6.0, prompt négatif actif. Plus fin, mais
  #                      environ 2,5× plus lent à réglages égaux.
  # ==========================================================================
  - id: ltx2-distilled
    name: "LTX-2.3 Distilled 22B (vidéo)"
    family: ltx2
    kind: video
    tags: [vidéo, audio, distillé, rapide, lourd]
    description: >
      **Génération vidéo AVEC bande-son**, en local, sans PyTorch : LTX-2.3 est
      lu nativement par sd.cpp (`-M vid_gen`). Variante **distillée 1.1 : 8 pas,
      CFG 1.0** — la seule raisonnable en dessous de 16 Go de VRAM. Trois modes :
      **texte → vidéo**, **image → vidéo** (anime une image fixe) et
      **début → fin** (deux images, le modèle fabrique l'entre-deux).
      Encodeur de prompt **Gemma-3-12B** (déchargé en RAM) et **deux VAE**
      (image + audio) : le `.webm` produit contient déjà le son.
      ⚠️ **Très lourd** : ~25 Go de téléchargement, et plusieurs minutes par
      clip sur une 11-12 Go. Commencez petit (704×384, 2 s) avant de monter.
    sources:
      diffusion:
        repo: unsloth/LTX-2.3-GGUF
        match: "distilled-1.1/ltx-2.3-22b-distilled-1.1-{quant}.gguf"
        quantizable: true
      vae:
        repo: unsloth/LTX-2.3-GGUF
        match: "vae/ltx-2.3-22b-distilled_video_vae.safetensors"
      audio_vae:
        repo: unsloth/LTX-2.3-GGUF
        match: "vae/ltx-2.3-22b-distilled_audio_vae.safetensors"
      embeddings_connectors:
        repo: unsloth/LTX-2.3-GGUF
        match: "text_encoders/ltx-2.3-22b-distilled_embeddings_connectors.safetensors"
      text_encoder:
        # Quant FIXE, volontairement. Le ladder {enc_quant} donnerait Q8_0 sur
        # 64 Go de RAM, soit 12,5 Go pour un encodeur de PROMPT — 5 Go de plus
        # sans gain visible sur la vidéo. La doc sd.cpp elle-même utilise un
        # Q4 (~7,4 Go). On s'aligne dessus.
        repo: unsloth/gemma-3-12b-it-GGUF
        match: "gemma-3-12b-it-Q4_K_M.gguf"
      spatial_upscaler:
        # Upscaler LATENT ×2 officiel, inséré ENTRE la passe basse résolution et
        # une passe de reprise (option « Détail ×2 » de l'onglet). Facultatif :
        # son absence ne bloque que cette case à cocher.
        repo: Lightricks/LTX-2.3
        match: "ltx-2.3-spatial-upscaler-x2-1.1.safetensors"
        optional: true
    defaults:
      steps: 8
      cfg_scale: 1.0
      sampler: euler
      scheduler: auto
      width: 1280
      height: 704
      supports_negative: false   # distillé à CFG 1.0 : le négatif est ignoré
      frames: 33
      fps: 24
      # Grille du modèle : images de la forme 8k+1, dimensions alignées sur 32.
      frame_step: 8
      frame_base: 1
      size_align: 32
      # Option qui n'existe QUE pour LTXAV : sert à vérifier que le binaire
      # installé sait charger ce modèle (voir sdcpp.missing_options).
      # Volume total à télécharger, affiché dans l'onglet.
      download_gb: 25
      engine_options: ["--embeddings-connectors"]
    presets:
      - {name: "⚡ Officiel (8 pas)",  sampler: euler, scheduler: auto, steps: 8,  cfg_scale: 1.0}
      - {name: "Très rapide (6 pas)", sampler: euler, scheduler: auto, steps: 6,  cfg_scale: 1.0}
      - {name: "Qualité (12 pas)",    sampler: euler, scheduler: auto, steps: 12, cfg_scale: 1.0}
    vram_min_gb: 11

  # --------------------------------------------------------------------------
  - id: ltx2-dev
    name: "LTX-2.3 Dev 22B (vidéo)"
    family: ltx2
    kind: video
    tags: [vidéo, audio, qualité, lourd]
    description: >
      Version **non distillée** de LTX-2.3 : ~20 pas à **CFG 6.0**, avec
      **prompt négatif actif**. Rendu plus fin et mieux tenu que la Distilled,
      mais environ **2,5× plus lent** — sur une 11-12 Go, comptez le double de
      patience. Mêmes trois modes (texte → vidéo, image → vidéo, début → fin) et
      même bande-son générée.
      Prenez-la si la Distilled vous convient déjà mais que vous voulez pousser
      la qualité, ou si vous avez ≥ 16 Go de VRAM. L'encodeur Gemma-3-12B est
      **partagé** avec la Distilled : si vous l'avez déjà, il n'est pas
      re-téléchargé.
    sources:
      diffusion:
        repo: unsloth/LTX-2.3-GGUF
        match: "ltx-2.3-22b-dev-{quant}.gguf"
        quantizable: true
      vae:
        repo: unsloth/LTX-2.3-GGUF
        match: "vae/ltx-2.3-22b-dev_video_vae.safetensors"
      audio_vae:
        repo: unsloth/LTX-2.3-GGUF
        match: "vae/ltx-2.3-22b-dev_audio_vae.safetensors"
      embeddings_connectors:
        repo: unsloth/LTX-2.3-GGUF
        match: "text_encoders/ltx-2.3-22b-dev_embeddings_connectors.safetensors"
      text_encoder:
        repo: unsloth/gemma-3-12b-it-GGUF
        match: "gemma-3-12b-it-Q4_K_M.gguf"
      spatial_upscaler:
        repo: Lightricks/LTX-2.3
        match: "ltx-2.3-spatial-upscaler-x2-1.1.safetensors"
        optional: true
    defaults:
      steps: 20
      cfg_scale: 6.0
      sampler: euler
      scheduler: auto
      width: 1280
      height: 704
      supports_negative: true
      frames: 33
      fps: 24
      frame_step: 8
      frame_base: 1
      size_align: 32
      # Volume total à télécharger, affiché dans l'onglet.
      download_gb: 25
      engine_options: ["--embeddings-connectors"]
      negative: "worst quality, low quality, blurry, distorted, artifacts"
    presets:
      - {name: "⚖️ Recommandé (20 pas)", sampler: euler, scheduler: auto, steps: 20, cfg_scale: 6.0}
      - {name: "Rapide (14 pas)",        sampler: euler, scheduler: auto, steps: 14, cfg_scale: 6.0}
      - {name: "Qualité (30 pas)",       sampler: euler, scheduler: auto, steps: 30, cfg_scale: 6.0}
    vram_min_gb: 12

  # ==========================================================================
  #  VIDÉO — MiniMax-H3 (doc sd.cpp : minimax_h3.md)
  # --------------------------------------------------------------------------
  #  Génère vidéo ET son STÉRÉO dans un même transformeur de diffusion « packé ».
  #  Deux variantes de DiT, incompatibles entre elles côté conditionnement :
  #    · FL2VA  -> texte→vidéo, image→vidéo, début→fin (les 3 modes habituels) ;
  #    · Ref2VA -> conditionnement par IMAGES DE RÉFÉRENCE (« garde ce
  #      personnage »), et il ne se combine PAS avec image de départ/fin.
  #  On prend les poids « pruned » : 11,4 Go contre 18,8 Go pour le DiT complet,
  #  seule version raisonnable ici.
  #
  #  ⚠️ PLUS LOURD QUE LTX-2.3, ET NETTEMENT. L'encodeur de prompt est un
  #  Qwen3-VL-32B (tronqué à 50 couches) : 18,2 Go à lui seul en Q4_K_M, contre
  #  7,3 Go pour le Gemma de LTX. Total ≈ 35 Go par variante, et TOUT réside en
  #  RAM pendant la génération (--offload-to-cpu) : compter 48 Go de RAM au
  #  minimum, 64 Go pour être tranquille. Le VAE vidéo (5,2 Go) est le pic VRAM,
  #  d'où le VAE tiling forcé.
  #
  #  Contraintes de forme (doc) : dimensions alignées VERS LE HAUT sur 32 px,
  #  images sur la grille 17k+5 (5, 22, 39, 56…), et 24 i/s IMPOSÉ — toute autre
  #  valeur est écrasée par le moteur, donc l'onglet verrouille le réglage.
  # ==========================================================================
  - id: minimax-h3-fl2va
    name: "MiniMax-H3 FL2VA (vidéo + son stéréo)"
    family: minimax_h3
    kind: video
    tags: [vidéo, audio, stéréo, qualité, très lourd]
    description: >
      **Vidéo et bande-son stéréo générées ensemble** par un seul transformeur
      (l'audio n'est pas rajouté après coup : il est produit dans la même passe
      de diffusion, donc synchronisé avec l'image). Variante **FL2VA** : les
      trois modes habituels — **texte → vidéo**, **image → vidéo** et
      **début → fin**.
      ⚠️ **Nettement plus lourd que LTX-2.3** : l'encodeur de prompt est un
      **Qwen3-VL-32B** (18,2 Go), le DiT « pruned » 11,4 Go, le VAE vidéo
      5,2 Go — soit **~35 Go** à télécharger, et autant en RAM pendant la
      génération. **48 Go de RAM minimum, 64 Go conseillés.** Sur une carte
      11-12 Go ça tourne par décharge RAM, mais c'est long : commencez en
      **864×480 sur 5 images** pour vérifier que ça passe avant d'allonger.
      ℹ️ 24 i/s imposé par le modèle, et durées par paliers (5, 22, 39, 56…
      images).
    sources:
      diffusion:
        repo: leejet/MiniMax-H3-GGUF
        match: "minimax_h3_fl2va_pruned-{quant}.gguf"
        quantizable: true
      text_encoder:
        # Qwen3-VL-32B tronqué à 50 couches, tour vision INCLUSE dans le GGUF
        # (pas de mmproj séparé dans ce dépôt -> pas de --llm_vision à passer).
        # Le dépôt ne publie que Q4_K_M et Q2_K_M : le ladder retombe sur
        # Q4_K_M partout, et Q2_K reste accessible en forçant la quant encodeur
        # dans les Réglages (13,1 Go au lieu de 18,2).
        repo: leejet/MiniMax-H3-GGUF
        match: "qwen3vl_32b_minimax_h3-{enc_quant}.gguf"
        quantizable: true
      vae:
        repo: Comfy-Org/MiniMax-H3
        match: "vae/minimax_h3_video_vae_fp16.safetensors"
      audio_vae:
        repo: Comfy-Org/MiniMax-H3
        match: "vae/minimax_h3_audio_vae_fp32.safetensors"
    defaults:
      steps: 20
      cfg_scale: 1.0
      sampler: euler
      scheduler: auto
      width: 864
      height: 480
      supports_negative: false   # CFG 1.0 dans toute la doc
      frames: 56
      fps: 24
      fps_fixed: true            # le moteur écrase toute autre valeur
      frame_step: 17             # grille 17k+5
      frame_base: 5
      size_align: 32
      rng: cpu                   # invocation documentée
      # Volume total à télécharger, affiché dans l'onglet.
      download_gb: 35
      engine_options: ["--ref-video"]   # marqueur du support MiniMax-H3
    presets:
      - {name: "⚖️ Recommandé (20 pas)", sampler: euler, scheduler: auto, steps: 20, cfg_scale: 1.0}
      - {name: "Rapide (12 pas)",        sampler: euler, scheduler: auto, steps: 12, cfg_scale: 1.0}
      - {name: "Qualité (30 pas)",       sampler: euler, scheduler: auto, steps: 30, cfg_scale: 1.0}
    vram_min_gb: 11

  # --------------------------------------------------------------------------
  - id: minimax-h3-ref2va
    name: "MiniMax-H3 Ref2VA (référence · personnage constant)"
    family: minimax_h3
    kind: video
    tags: [vidéo, audio, référence, personnage, très lourd]
    description: >
      Même modèle, variante **Ref2VA** : au lieu d'une image de départ, on lui
      donne des **images de référence** et on lui demande de garder ce
      personnage / cet objet d'un plan à l'autre. C'est ce que FL2VA ne sait pas
      faire — et l'inverse est vrai aussi : **Ref2VA ne gère ni image de départ
      ni image de fin**, c'est une contrainte du modèle, pas de l'interface.
      Désignez la référence dans le prompt (« use the cat from &lt;Picture 1&gt;
      … keep its appearance consistent »).
      L'encodeur Qwen3-VL-32B et les deux VAE sont **partagés avec la variante
      FL2VA** : si vous l'avez déjà, seuls 11,4 Go de DiT sont à télécharger.
    sources:
      diffusion:
        repo: leejet/MiniMax-H3-GGUF
        match: "minimax_h3_ref2va_pruned-{quant}.gguf"
        quantizable: true
      text_encoder:
        repo: leejet/MiniMax-H3-GGUF
        match: "qwen3vl_32b_minimax_h3-{enc_quant}.gguf"
        quantizable: true
      vae:
        repo: Comfy-Org/MiniMax-H3
        match: "vae/minimax_h3_video_vae_fp16.safetensors"
      audio_vae:
        repo: Comfy-Org/MiniMax-H3
        match: "vae/minimax_h3_audio_vae_fp32.safetensors"
    defaults:
      steps: 20
      cfg_scale: 1.0
      sampler: euler
      scheduler: auto
      width: 864
      height: 480
      supports_negative: false
      frames: 56
      fps: 24
      fps_fixed: true
      frame_step: 17
      frame_base: 5
      size_align: 32
      rng: cpu
      reference: true            # -> mode « référence » dans l'onglet Vidéo
      # Volume total à télécharger, affiché dans l'onglet.
      download_gb: 35
      engine_options: ["--ref-video"]
    presets:
      - {name: "⚖️ Recommandé (20 pas)", sampler: euler, scheduler: auto, steps: 20, cfg_scale: 1.0}
      - {name: "Rapide (12 pas)",        sampler: euler, scheduler: auto, steps: 12, cfg_scale: 1.0}
      - {name: "Qualité (30 pas)",       sampler: euler, scheduler: auto, steps: 30, cfg_scale: 1.0}
    vram_min_gb: 11

