[package]
name = "turboslop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native TurboSlop image studio for Windows x64"

[dependencies]
anyhow = "1"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "x11"] }
fs2 = "0.4"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2.12", features = ["json", "native-certs", "proxy-from-env"] }
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[profile.release]
lto = "thin"
strip = true
