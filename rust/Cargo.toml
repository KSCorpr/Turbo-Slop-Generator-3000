[package]
name = "turboslop"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Native TurboSlop image studio for Windows x64"

[dependencies]
anyhow = "1"
burn = { version = "=0.21.0", default-features = false, features = ["wgpu", "fusion", "std"] }
combs-diffusion = "=0.2.3"
combs-formats = "=0.2.3"
combs-models = "=0.2.3"
cubecl = { version = "0.10", default-features = false }
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "x11"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2.12", features = ["json", "native-certs", "proxy-from-env"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[profile.release]
lto = "thin"
strip = true
