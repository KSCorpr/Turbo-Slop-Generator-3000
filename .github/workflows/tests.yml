name: Tests application

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python 3.12 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q app.py atelier scripts tests

      - name: Exécuter les tests
        run: python -m unittest discover -s tests -v

      - name: Vérifier les dépendances
        run: python -m pip check

  seedvr2-wheels:
    name: SeedVR2 Windows wheel imports
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned SeedVR2 Torch runtime
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cu126
      - name: Install attention Python dependencies
        run: python -m pip install "uv>=0.8,<1" einops packaging numpy
      - name: Verify prebuilt Windows wheels without a GPU
        run: python tests/verify_seedvr2_wheels.py
      - name: Verify dependencies
        run: python -m pip check

  browser:
    name: Studio browser journeys
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Vérifier les parcours sans GPU
        run: python tests/browser_smoke.py --screenshots tmp/ui-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-screenshots
          path: tmp/ui-check
